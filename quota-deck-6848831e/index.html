const SEG={0:"abcdef",1:"bc",2:"abged",3:"abgcd",4:"fgbc",5:"afgcd",6:"afgedc",7:"abc",8:"abcdefg",9:"abcdfg"};
function digit(ch,x,cls){const on=SEG[ch]||"";const r=(k,geo)=>`<rect class="s ${on.includes(k)?"on "+cls:""}" x="${geo[0]}" y="${geo[1]}" width="${geo[2]}" height="${geo[3]}"/>`;
 return `<g transform="translate(${x},0)">${r("a",[10,0,40,8])}${r("b",[52,6,8,38])}${r("c",[52,52,8,38])}${r("d",[10,88,40,8])}${r("e",[0,52,8,38])}${r("f",[0,6,8,38])}${r("g",[10,44,40,8])}</g>`}
function seg7(n){const cls=n>=T?"red":n>=80?"org":"";const s=String(Math.min(999,Math.round(n))).padStart(3," ");let g="";[0,1,2].forEach(i=>{g+=digit(s[i]===" "?"":s[i],8+i*76,cls)});
 return `<svg width="150" height="60" viewBox="0 0 236 96" aria-label="${Math.round(n)} percent"><g transform="skewX(-5)">${g}</g></svg>`}
function meter(p){const n=Math.round((p||0)/5);const cls=p>=T?"red":p>=80?"org":"";let h="";for(let i=0;i<20;i++)h+=`<i class="${i<n?"on "+cls:""}${i===18?" thr":""}"></i>`;return h}
function ago(iso){if(!iso)return"";const s=(Date.now()-new Date(iso))/1000;return s<90?"just now":s<3600?Math.round(s/60)+"m ago":Math.round(s/3600)+"h ago"}
function unit(name,sub,spec,accts,err,tabs,poll){
 const act=accts.find(a=>a.active)||accts[0]||{max:0,windows:[]};const peak=Math.max(0,...(act.windows||[]).map(w=>w.pct||0));
 const limit=peak>=T, near=peak>=80, both=accts.length>=2&&accts.every(a=>a.max>=T);
 const lcd=accts.length?accts.map(a=>`<div class="acct"><div class="acct-h"><span class="who ${a.active?"":"dim"}">${esc(a.email)}</span><span class="lbl ${a.active?"box-inv":"box-ghost"}">${a.active?"active":"standby"}</span></div>
   ${a.windows.map(w=>`<div class="row"><span class="w ${a.active?"on":""}">${esc(w.label)}</span><span class="meter">${meter(w.pct)}</span><span class="v">${w.pct==null?"--":Math.round(w.pct)}</span><span class="r ${a.active?"on":""}">${esc(w.countdown||"")}</span></div>`).join("")}
   <div class="row" style="grid-template-columns:1fr"><span class="w">read ${ago(a.fetchedAt)}${a.plan?" · "+esc(a.plan):""}${a.resetCredits?" · reset credits "+a.resetCredits:""}</span></div></div>`).join("")
  :`<div class="lbl">no data${err?" · "+esc(err):""}</div>`;
 return `<section class="ko2">
  <div class="plate">
   <div class="tabs">${tabs}</div>
   <span class="screw tl"></span><span class="screw tr"></span>
   <div class="wordmark"><div><h3>${name}</h3><div class="sub">${sub}</div><div class="spec">${spec}</div></div>
    <svg class="grille" height="64" aria-hidden="true"><defs><pattern id="d${name.length}" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#8f8d8a"/></pattern></defs><rect width="72" height="64" fill="#d2d0cd"/><rect width="72" height="64" fill="url(#d${name.length})"/></svg></div>
  </div>
  <div class="lcd">
   <div class="lcd-top"><div class="seg7">${seg7(peak)}</div>
    <div class="cluster">
     <span class="lbl on">peak %</span><span class="lbl ${limit?"box-red":"box-ghost"}">limit</span><span class="lbl ${near?"org":""}">near</span><span class="lbl ${both?"red":""}">both</span>
     <span class="lbl on">${esc((act.email||"—").split("@")[0])}</span><span class="lbl ${accts.length>=2?"on":""}">2 acct</span><span class="lbl on">${T}</span><span class="lbl">hold</span>
    </div></div>
   ${lcd}
  </div>
  <div class="deck">
   <div class="deck-left">
    <div class="leds"><span class="led ${act.email?"on":""}">link</span><span class="led ${accts.length>=2?"on":""}">armed</span><span class="led ${limit?"on":""}">limit</span><span class="led ${near&&!limit?"on":""}">near</span></div>
    <div class="split">${accts.slice(0,2).map(a=>`<div class="h ${a.active?"orange":"dark"}"><span>${esc((a.email||"").split("@")[0])}</span><small>${a.active?"on":Math.round(a.max)+"%"}</small></div>`).join("")}${accts.length<2?'<div class="h pale"><span>—</span><small>add</small></div>':""}</div>
    <div class="keys"><div class="key light"><div class="face">auto</div></div><div class="key mid"><div class="face">poll ${poll}</div></div></div>
   </div>
   <div class="deck-right">
    <div><div class="knob" style="--rot:${-135+270*T/100}deg"></div><div class="knob-lbl">switch<b>${T}%</b></div></div>
    <div class="key ${limit?"orange":"light"}" style="width:64px"><div class="face">${limit?"switching":"hold"}</div></div>
   </div>
   <div class="bracket"><span style="padding:0 6px">${esc(sub)}</span></div>
  </div>
 </section>`}
document.getElementById("thr").textContent=T+"%";
document.getElementById("units").innerHTML=
 unit("Claude Code","two-account failover · claude-swap","5h · 7d · per-model weekly",D.claude,D.claudeError,'<span class="tab">5h</span><span class="tab">7d</span><span class="tab accent">model</span><span class="tab plain push" style="margin-left:auto;margin-right:0">auto</span>',"60s")+
 unit("Codex CLI","cmux ~/.codex-c · caam","account 7d · per-model 5h/7d",D.codex,null,'<span class="tab">acct</span><span class="tab accent">model</span><span class="tab dark">cmux</span><span class="tab grey" style="margin-left:auto">mac app · separate</span><span class="tab plain push" style="margin-right:0">auto</span>',"120s");
document.getElementById("meta").textContent="generated "+D.generatedAt;
const ag=D.agents;document.getElementById("agents").innerHTML=["claude","codex","dashboard","pages"].map(k=>{const a=ag[k];const run=a&&(a.pid!=="-"||a.code==="0");return `<div>${k} agent <b class="${run?"":"off"}">${a?(a.pid!=="-"?"running":"idle · exit "+a.code):"off"}</b></div>`}).join("");
document.getElementById("events").innerHTML=(D.events.length?D.events.map(e=>`<div>${esc(e)}</div>`).join(""):`<div>no switch events yet</div>`);
</script>
</body></html>
