.ko2{--plate:var(--ko2-plate);--housing:var(--ko2-housing);--accent:var(--ko2-orange);--accent-hi:#f7834f;--accent-lo:#a63a15;--accent-cap:#f27448;--accent-dimple:#ffb79c;color:var(--ink);border-radius:var(--r-md);overflow:hidden;border:1px solid rgba(0,0,0,.18);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;zoom:1.0}

.plate{background:var(--plate);position:relative}
.deck{background:var(--housing);position:relative;padding:14px 16px 16px;display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:start}

.tab.push::before{content:"";position:absolute;top:-8px;left:50%;width:10px;height:9px;margin-left:-5px;background:var(--accent);border-radius:2px 2px 0 0}

.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:#cfcdc9;border:1px solid #9c9a97}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:1px;background:#8a8885;transform:rotate(-30deg)}
.screw.tl{top:32px;left:8px}.screw.tr{top:32px;right:8px}
.grille{display:block;width:72px}

.lcd-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.seg7 svg{display:block}.seg7 .s{fill:var(--ko2-ghost)}.seg7 .s.on{fill:var(--ko2-seg)}.seg7 .s.on.red{fill:var(--ko2-disp-red)}.seg7 .s.on.org{fill:var(--ko2-disp-orange)}

.lbl.on{color:var(--ko2-seg)}.lbl.org{color:var(--ko2-disp-orange)}.lbl.red{color:var(--ko2-disp-red)}
.lbl.box-red{color:var(--ko2-seg);border:1.5px solid var(--ko2-disp-red);padding:1px 4px;border-radius:2px}
.lbl.box-inv{background:var(--ko2-seg);color:#000;padding:1px 6px}

.acct-h .who.dim{color:var(--ko2-ghost-2)}
.row{display:grid;grid-template-columns:118px 1fr 34px 60px;gap:8px;align-items:center;font-size:9px}
.row .w{color:var(--ko2-ghost-2);letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .w.on{color:var(--ko2-seg)}
.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;height:9px}
.meter i{display:block;background:var(--ko2-ghost)}
.meter i.on{background:var(--ko2-seg)}.meter i.on.org{background:var(--ko2-disp-orange)}.meter i.on.red{background:var(--ko2-disp-red)}
.meter i.thr{outline:1px solid var(--ko2-disp-red);outline-offset:-1px}
.row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ko2-seg)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;color:var(--ko2-ghost-2);white-space:nowrap}
.row .r.on{color:var(--ko2-seg)}
.led{display:inline-flex;align-items:center;gap:7px;font-size:9px;letter-spacing:.1em;color:var(--ko2-label);height:14px;white-space:nowrap}
.led::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--led-off);outline:2px solid rgba(0,0,0,.15)}
.led.on::before{background:var(--led-on);outline-color:rgba(229,52,28,.22)}
.leds{display:grid;grid-template-columns:repeat(2,auto);gap:8px 18px;justify-content:start;align-content:start}
.key{--k:var(--ko2-key-dark);--lip:var(--ko2-key-dark-lip);--base:var(--ko2-key-dark-base);--kink:var(--ko2-numeral);width:64px;height:40px;padding:2px;background:var(--ko2-well);border-radius:4px}
.key .face{position:relative;height:100%;border-radius:3px;background:var(--k);color:var(--kink);border-top:1px solid var(--lip);border-bottom:3px solid var(--base);display:flex;align-items:center;justify-content:center;font-size:9px;letter-spacing:.08em;transition:transform var(--dur-fast) var(--ease-out),border-bottom-width var(--dur-fast) var(--ease-out)}
.key:active .face{transform:translateY(1px);border-bottom-width:2px}
.key.light{--k:var(--ko2-key-light);--lip:var(--ko2-key-light-lip);--base:var(--ko2-key-light-base);--kink:var(--ink)}
.key.orange{--k:var(--accent);--lip:var(--accent-hi);--base:var(--accent-lo);--kink:#fff}
.key.mid{--k:var(--ko2-key-mid);--lip:#686664;--base:#262524;--kink:#f2f2f0}
.split{display:grid;grid-template-rows:1fr 1fr;gap:2px;width:100%;height:64px;padding:2px;background:var(--ko2-well);border-radius:4px}
.split .h{position:relative;border-radius:3px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:9px;letter-spacing:.04em;text-transform:none;border-top:1px solid var(--lip);border-bottom:3px solid var(--base);background:var(--k);color:var(--kink)}
.split .h.dark{--k:var(--ko2-key-dark);--lip:var(--ko2-key-dark-lip);--base:var(--ko2-key-dark-base);--kink:var(--ko2-numeral)}
.split .h.pale{--k:var(--ko2-key-pale);--lip:#f4f2ef;--base:#9c9a97;--kink:var(--ink)}
.split .h.orange{--k:var(--accent);--lip:var(--accent-hi);--base:var(--accent-lo);--kink:#fff}
.split .h small{font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.knob{width:54px;height:54px;border-radius:50%;position:relative;--cap:var(--ko2-knob-orange);--skirt:#c9481f;--dimple:#f27a4e;background:var(--cap);border:6px solid var(--skirt)}
.knob::before{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--dimple)}
.knob::after{content:"";position:absolute;top:2px;left:50%;width:2px;height:9px;margin-left:-1px;background:rgba(255,255,255,.85);transform-origin:1px 19px;transform:rotate(var(--rot,0deg))}
.knob-lbl{font-size:9px;letter-spacing:.1em;text-align:center;margin-top:10px;color:var(--ko2-label)}
.knob-lbl b{display:block;font-weight:400;color:var(--ink)}
.bracket{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-size:9px;letter-spacing:.12em;color:var(--ko2-label);grid-column:1/-1}
.bracket::before,.bracket::after{content:"";height:8px;border-top:1px solid currentColor}
.bracket::before{border-left:1px solid currentColor}.bracket::after{border-right:1px solid currentColor}
.deck-left{display:grid;gap:10px}
.cap{font-family:var(--font-display);font-size:9px;letter-spacing:.05em;color:#4a4948;text-transform:uppercase;text-align:center;margin-top:5px;white-space:nowrap}
.keys>div{display:grid;justify-items:center}
.acct-brk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;font-family:var(--font-display);font-size:9.5px;letter-spacing:.08em;color:#4a4948;margin-top:2px}
.acct-brk::before,.acct-brk::after{content:"";height:7px;border-top:1px solid currentColor}.acct-brk::before{border-left:1px solid currentColor}.acct-brk::after{border-right:1px solid currentColor}
.deck-right{display:grid;gap:10px;justify-items:center}
.keys{display:grid;grid-template-columns:repeat(2,64px);gap:8px}
.system{margin-top:28px;border-top:1px solid var(--ink);padding-top:10px;font-family:var(--font-mono);font-size:13px;display:grid;grid-template-columns:1fr auto;gap:8px 32px;text-transform:lowercase}
.system .ev{display:grid;gap:3px}
.system .st{display:grid;gap:3px;text-align:right}
.system .st b{font-weight:500;color:var(--accent-ko)}
.system .st b.off{color:var(--ink)}
.note{font-family:var(--font-mono);font-size:13px;color:var(--fg-3);margin-top:16px;text-transform:lowercase}


/* ---- 실사 오버라이드 v2 — EP-133 K.O. II 제품 렌더 기준 ---- */
.ko2{border:0;border-radius:6px;box-shadow:0 30px 50px -22px rgba(0,0,0,.6),0 8px 16px -8px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.22)}
.plate{background:linear-gradient(180deg,#e9e6e2 0%,#e2dfdb 55%,#dbd8d4 100%)}
.deck{background:linear-gradient(180deg,#b3b1ae 0%,#acaaa7 45%,#a3a19e 100%);padding:16px 18px 20px;gap:14px 18px}
.tabs{height:28px}
.tab{height:24px;font-family:var(--font-display);font-size:9.5px;font-weight:500;letter-spacing:.06em;box-shadow:0 1px 1px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.7)}
.tab.accent{background:linear-gradient(180deg,var(--accent-hi),var(--accent) 50%,var(--accent-lo));text-shadow:0 1px 0 rgba(0,0,0,.25)}
.tab.dark{background:linear-gradient(180deg,#4d4d4d,#333 50%,#232323)}
.tab.grey{background:linear-gradient(180deg,#8e8d8b,#7d7c7a 50%,#6a6967)}
.tab.push::before{background:linear-gradient(180deg,var(--accent-hi),var(--accent));box-shadow:0 1px 1px rgba(0,0,0,.3)}
.screw{width:10px;height:10px;background:radial-gradient(circle at 35% 30%,#f7f5f2,#c9c7c3 50%,#8f8d8a);border:1px solid #6f6d6a;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5),0 1px 1px rgba(0,0,0,.35)}
.wordmark h3{font-weight:300;font-size:28px;letter-spacing:-.01em}
.wordmark .spec{font-family:var(--font-display);font-size:11px;letter-spacing:.04em;font-weight:400;color:#2a2a2a}
.grille rect:first-child{fill:#b9b7b3}
.grille circle{fill:#3c3b39}
.grille{width:84px;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
.lcd{background:#070707;border-top:0;border-bottom:0;padding:14px 16px 14px;box-shadow:inset 0 0 0 1px #000,inset 0 6px 14px rgba(0,0,0,.9),inset 0 -2px 0 rgba(255,255,255,.04)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.06) 0%,rgba(255,255,255,.015) 30%,transparent 48%)}
.lcd-top,.acct{position:relative;z-index:1}
.seg7 .s{fill:#1c1c1c}.seg7 .s.on{fill:#f4f4f2;filter:drop-shadow(0 0 2px rgba(255,255,255,.45))}
.seg7 .s.on.red{fill:#ff4a2e;filter:drop-shadow(0 0 4px rgba(255,74,46,.7))}.seg7 .s.on.org{fill:#ff7a3a;filter:drop-shadow(0 0 4px rgba(255,122,58,.7))}
.lbl{color:#242424}.lbl.on{color:#f2f2f0}.lbl.box-ghost{border-color:#2a2a2a;color:#2a2a2a}
.lbl.box-red{border-color:#ff4a2e;box-shadow:0 0 5px rgba(255,74,46,.55)}
.meter i{background:#1c1c1c}
.meter i.on{background:#f2f2f0;box-shadow:0 0 3px rgba(255,255,255,.35)}
.meter i.on.org{background:#ff7a3a;box-shadow:0 0 4px rgba(255,122,58,.6)}
.meter i.on.red{background:#ff4a2e;box-shadow:0 0 4px rgba(255,74,46,.7)}
.meter i.thr{outline-color:#ff4a2e}
.acct{border-top-color:#1e1e1e}.acct-h .who.dim,.row .w,.row .r{color:#2c2c2c}.row .w.on,.row .r.on{color:#e8e8e6}
.led{font-family:var(--font-display);font-size:9.5px;letter-spacing:.05em;color:#3d3c3a;gap:8px}
.led::before{width:7px;height:7px;background:radial-gradient(circle at 40% 35%,#5a5856,#2f2e2c 65%);outline:none;box-shadow:0 0 0 2px #7c7a77,0 0 0 3px rgba(0,0,0,.18),inset 0 1px 1px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.35)}
.led.on::before{background:radial-gradient(circle at 40% 35%,#ffd2c6,#ff4a2e 40%,#d3230c 100%);box-shadow:0 0 0 2px #7c7a77,0 0 0 3px rgba(0,0,0,.18),0 0 5px 1px rgba(255,74,46,.9),0 0 12px 3px rgba(255,74,46,.45),inset 0 0 2px rgba(255,255,255,.7)}
/* 키캡: 두툼한 매트 플라스틱, 윗면 밝고 옆면 어둡고 아래 그림자 */
.key{width:66px;height:52px;padding:0;background:transparent;border-radius:6px}
.key .face{border-radius:5px;border:0;font-family:var(--font-display);font-size:10px;font-weight:500;letter-spacing:.06em;
 background:linear-gradient(180deg,color-mix(in srgb,var(--k) 84%,#fff) 0%,var(--k) 30%,color-mix(in srgb,var(--k) 90%,#000) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.35),inset 1px 0 0 rgba(255,255,255,.08),inset -1px 0 0 rgba(0,0,0,.2),
 0 5px 0 color-mix(in srgb,var(--k) 55%,#000),0 8px 8px -2px rgba(0,0,0,.55),0 12px 18px -6px rgba(0,0,0,.35)}
.key .face::before{content:"";position:absolute;left:6%;right:6%;top:3px;height:34%;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0))}
.key.light .face::before,.key.pale .face::before{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.key.light{--k:#d8d6d2}.key.mid{--k:#5a5856;--kink:#f2f2f0}
.key.orange .face{text-shadow:0 1px 0 rgba(0,0,0,.3)}
.key:active .face{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 2px 0 color-mix(in srgb,var(--k) 55%,#000),0 3px 4px -1px rgba(0,0,0,.5)}
.keys{grid-template-columns:repeat(2,auto);gap:12px;justify-content:start}
.split{height:auto;padding:0;background:transparent;border-radius:6px;gap:8px}
.split .h{height:44px;border:0;border-radius:5px;font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
 background:linear-gradient(180deg,color-mix(in srgb,var(--k) 84%,#fff) 0%,var(--k) 30%,color-mix(in srgb,var(--k) 90%,#000) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.35),0 5px 0 color-mix(in srgb,var(--k) 55%,#000),0 8px 8px -2px rgba(0,0,0,.55),0 12px 18px -6px rgba(0,0,0,.35);overflow:hidden}
.split .h::before{content:"";position:absolute;left:3%;right:3%;top:2px;height:36%;border-radius:3px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
.split .h.pale{--k:#dcdad6}.split .h.orange{text-shadow:0 1px 0 rgba(0,0,0,.3)}
.split .h small{font-size:10px;font-weight:500;letter-spacing:.08em;opacity:.9}
.split .h .account-status{display:grid;gap:3px;text-align:right;line-height:1.3;letter-spacing:0}
/* Individual tape strips cross the top edge of each account key. */
.split .h{overflow:visible}
.split .h .account-status{opacity:1}
.split .h .reset-tapes{position:absolute;left:27%;top:-12px;display:flex;gap:9px;height:48px;z-index:2;pointer-events:none}
.split .h .reset-empty{align-self:end;font-size:10px;white-space:nowrap}
.split .h .reset-credit{position:relative;display:flex;align-items:center;justify-content:center;width:24px;height:48px;box-sizing:border-box;white-space:nowrap;font-size:10px;font-weight:600;line-height:1;letter-spacing:0;color:#172230;text-shadow:0 1px 0 rgba(255,255,255,.3);background:linear-gradient(95deg,rgba(255,255,255,.66),rgba(228,237,242,.48) 48%,rgba(246,250,252,.63));border:1px solid rgba(255,255,255,.4);border-radius:0;box-shadow:0 1px 2px rgba(0,0,0,.32),inset 1px 0 0 rgba(255,255,255,.45);transform:rotate(17deg);pointer-events:none}
.split .h .reset-credit:nth-child(3n+2){transform:translateY(-2px) rotate(23deg)}
.split .h .reset-credit:nth-child(3n){transform:translateY(1px) rotate(12deg)}
.split .h .reset-credit::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.22) 23%,transparent 28%,transparent 75%,rgba(255,255,255,.12) 80%,transparent 85%)}

@media(max-width:380px){.split .h .reset-tapes{left:25%;gap:5px}.split .h .reset-credit{width:18px;font-size:9px}}
/* 노브: 원통형 다크 스커트 + 캡 + 딤플, 우하단 낙하 그림자 */

document.getElementById("reading-guide").textContent="숫자·막대는 남은 양입니다. 큰 숫자는 사용 중 계정에서 가장 적게 남은 한도입니다. 잔여 "+(100-T)+"% 이하에서 자동 전환 · 대기 Codex는 마지막 조회 기준 · 화면은 2분마다 갱신됩니다.";
document.getElementById("units").innerHTML=
 unit("Codex CLI","cmux ~/.codex-c · caam","계정 전체 주간 · 모델별 5시간 / 주간",D.codex,null,`<span class="tab">acct</span><span class="tab accent">model</span>${(()=>{const cm=short((D.codex.find(a=>a.active)||{}).email), ap=short(D.codexMacApp);
   const grp=(name,cur)=>`<span class="hg"><b>${name}</b><span class="led ${cur==="gmail"?"on":""}">gm</span><span class="led ${cur==="C8"?"on":""}">c8</span></span>`;
   return `<span class="homeleds" style="margin-left:auto;margin-right:auto;position:relative;left:-10px" title="두 홈은 분리되어 서로 영향 없음. CMUX=~/.codex-c (자동 전환 대상), APP=~/.codex (고정)">${grp("cmux",cm)}${grp("app",ap)}</span>`})()}<span class="tab plain push" style="margin-right:0">auto</span>`,(C.codex_poll||120)+"s","blue","codex")+
 unit("Claude Code","two-account failover · claude-swap","전체 5시간 / 주간 · 모델별 주간",D.claude,D.claudeError,'<span class="tab">5h</span><span class="tab">7d</span><span class="tab accent">model</span><span class="tab plain push" style="margin-left:auto;margin-right:0">auto</span>',(C.claude_interval||60)+"s",null,"claude");
document.getElementById("meta").textContent=D.generatedAt.slice(11,16)+(LOCAL?" · local control":" · display only");
if(!LOCAL){document.querySelectorAll('[data-act="refresh"]').forEach(el=>{el.style.cursor="pointer";el.addEventListener("click",()=>location.reload())})}
if(LOCAL){
 const post=async(name,body)=>{const r=await fetch("/api/"+name,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();document.getElementById("meta").textContent=(j.ok?"ok · ":"error · ")+String(j.out||"").slice(0,40);setTimeout(()=>location.reload(),j.ok?2500:6000);return j};
 document.querySelectorAll("[data-act]").forEach(el=>{el.style.cursor="pointer";el.addEventListener("click",async()=>{
  const prov=el.closest("[data-prov]").dataset.prov, act=el.dataset.act;
  if(act==="switch"){if(el.dataset.active==="1")return;if(!confirm(prov+" → "+el.dataset.account+" 로 전환할까요?"))return;return post("switch",{provider:prov,account:el.dataset.account})}
  if(act==="refresh")return post("refresh",{provider:prov});
  if(act==="auto")return post("auto",{provider:prov,on:el.dataset.on!=="1"});
  if(act==="hold")return post("hold",{provider:prov,on:el.dataset.on!=="1"});
  if(act==="threshold"){const v=prompt("잔여량이 몇 % 이하이면 자동 전환할까요? (1–50, 두 유닛 공통)",100-T);if(v==null)return;const n=Number(v);if(!v.trim()||!Number.isInteger(n)||n<1||n>50){alert("1~50 사이의 정수를 입력해 주세요.");return}return post("threshold",{value:100-n})}
  if(act==="poll"){const v=prompt(prov+" 감시 주기(초)"+(prov==="codex"?" · 최소 120":" · 최소 15"),prov==="codex"?(C.codex_poll||120):(C.claude_interval||60));if(v==null)return;return post("poll",{provider:prov,seconds:parseInt(v,10)})}
 })});
 const rb=document.createElement("div");rb.className="note";rb.textContent='긴 키 = 계정 전환 · auto = 자동 전환 on/off · ↻ = 지금 다시 읽기 · hold = 60분 보류 · 노브 = 자동 전환 잔여량 · 60s/120s = 주기';document.querySelector(".page").appendChild(rb);
}
setInterval(()=>{document.querySelectorAll(".reset-clock").forEach(el=>{const r=resetText(el.dataset.reset);el.firstElementChild.textContent=r.relative;el.lastElementChild.textContent=r.date})},30000);
const ag=D.agents;document.getElementById("agents").innerHTML=["claude","codex","dashboard","pages","server"].map(k=>{const a=ag[k];const run=a&&(a.pid!=="-"||a.code==="0");return `<div>${k} agent <b class="${run?"":"off"}">${a?(a.pid!=="-"?"running":"idle · exit "+a.code):"off"}</b></div>`}).join("");
document.getElementById("events").innerHTML=(D.events.length?D.events.map(e=>`<div>${esc(e)}</div>`).join(""):`<div>no switch events yet</div>`);
</script>
</body></html>
