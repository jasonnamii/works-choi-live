<title>LIMIT BOARD</title></head><body>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7fcff">
<script>
(()=>{try{for(const storage of [localStorage,sessionStorage])for(const key of Object.keys(storage)){if(!key.startsWith('quota-deck'))continue;const next='limit-board'+key.slice('quota-deck'.length);if(storage.getItem(next)===null)storage.setItem(next,storage.getItem(key));storage.removeItem(key)}}catch(e){}let mode='sys';try{mode=localStorage.getItem('limit-board-theme')||'sys'}catch(e){}
const night=mode==='night'||(mode!=='day'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=night?'night':'day';})();
</script>

function resetText(iso){const ts=iso?new Date(iso).getTime():NaN;if(!Number.isFinite(ts))return{relative:"리셋 시각 미확인",date:""};
 const delta=ts-Date.now(),mins=Math.ceil(delta/60000),days=Math.floor(mins/1440),hours=Math.floor(mins%1440/60),m=mins%60;
 const relative=delta<=0?"리셋 시각 지남 · 재조회 대기":(days?`${days}일 ${hours}시간`:hours?`${hours}시간 ${m}분`:`${m}분`)+" 후 리셋";
 const d=new Date(ts),pad=n=>String(n).padStart(2,"0");return{relative,date:`${d.getMonth()+1}/${d.getDate()}(${'일월화수목금토'[d.getDay()]}) ${pad(d.getHours())}:${pad(d.getMinutes())}`}}
function resetMarkup(iso){const r=resetText(iso);return `<span class="reset-clock" data-reset="${esc(iso||"")}"><span>${r.relative}</span><small>${r.date}</small></span>`}

function resetTapes(credits, details, fetchedAt){
 if(!Number.isSafeInteger(credits)||credits<=0)return "";
 const available=(Array.isArray(details)?details:[]).filter(c=>c.status==="available");
 const date=sec=>new Date(sec*1000).toLocaleString('ko-KR',{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'});
 return `<span class="reset-marks">${Array.from({length:Math.max(1,credits)},(_,i)=>{
  const c=available[i];
  const expiry=!credits?'보유한 리셋 사용권 없음':c&&c.expiresAt===null?'사용 기한 제한 없음':c&&Number.isFinite(c.expiresAt)?`${date(c.expiresAt)}까지 사용 가능`:'사용 기한 미확인';
  return `<details class="reset-mark ${credits?'':'empty'}"><summary aria-label="${credits?'Codex 리셋 사용권 '+(i+1)+' · 사용 기한 보기':'Codex 리셋 사용권 없음'}"><img src="${CODEX_MARK}" alt="" width="30" height="30"></summary><div class="reset-detail"><strong>Codex 리셋 사용권</strong><span>${esc(expiry)}</span>${c&&Number.isFinite(c.grantedAt)?`<small>${esc(date(c.grantedAt))} 지급</small>`:''}<small>${esc(ago(fetchedAt))} 기준 · 기기 현지 시각</small></div></details>`;
 }).join('')}</span>`;
}
document.addEventListener('click',e=>{document.querySelectorAll('.reset-mark[open]').forEach(d=>{if(!d.contains(e.target))d.open=false})});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.reset-mark[open]').forEach(d=>{d.open=false;d.querySelector('summary').focus()})});

const primaryWindow=(provider,a)=>provider==='codex'
 ?(a.windows||[]).find(w=>w.label==='계정 전체 · 주간 한도')
 :(a.windows||[]).find(w=>/fable|페이블/i.test(w.label||''));
function shortReset(iso){const d=new Date(iso||'');return Number.isFinite(d.getTime())?`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`:'리셋 미확인'}
function accountWarning(a){
 const windows=a.windows||[];
 const needsLogin=(!windows.length&&!!a.error)||!!a.needsLogin;
 if(needsLogin)return a.peerSnapshot?'상대 기기 조회 · 현재 기기 로그인 필요':'로그인 필요';
 if(a.peerSnapshot)return '상대 기기 조회 · 현재 기기 조회 실패';
 if(a.error)return windows.length?'최근 조회 실패 · 이전 값':String(a.error);
 if(!isFresh(a.fetchedAt))return ago(a.fetchedAt);
 return '';
}
function unit(provider,name,label){
 const data=D[provider],accts=data.accounts||[],active=accts.find(a=>a.active),primary=active&&primaryWindow(provider,active),left=remaining(primary?.pct);
 const fiveHour=active&&(active.windows||[]).find(w=>w.label==='5시간 한도');
 const secondary=provider==='claude'?`<span class="secondary-value">(5시간 잔여 ${pctText(remaining(fiveHour?.pct))})</span>`:'';
 const headline=active?`<div class="active-label">사용 중 · ${esc(short(active.email))}</div><div class="selected-name">${esc(active.email)}</div><div class="selected-reset">${primary?esc(resetText(primary.resetsAt).relative):'주간 한도 미확인'}</div><div class="selected-value"><span class="selected-number">${left==null?'—':Math.round(left)}${left==null?'':'<small>%</small>'}</span>${secondary}</div>`:'<div class="active-label">사용 중인 계정 미확인</div><div class="selected-name">계정별 한도를 확인해 주세요.</div><div class="selected-value">—</div>';
 const accounts=accts.map((a,index)=>{
  const w=primaryWindow(provider,a),remainingPct=remaining(w?.pct),warning=accountWarning(a);
  const fiveHourLeft=remaining((a.windows||[]).find(w=>w.label==='5시간 한도')?.pct);
  const mobileSecondary=provider==='claude'?`<span class="mobile-five-hour">(5시간 ${pctText(fiveHourLeft)})</span>`:'';
  return `<button type="button" class="account ${a.active?'is-active':'is-standby'}" data-account="${index}" data-prov="${provider}" style="--remaining:${remainingPct??0}%" aria-haspopup="dialog" aria-label="${esc(a.email||'이메일 미확인')} · ${a.active?'사용 중':'대기'} · ${label} 잔여 ${pctText(remainingPct)} · 상세 보기"><span class="who"><span class="email" title="${esc(a.email)}">${esc(a.email||'이메일 미확인')}</span></span><span class="value ${remainingPct==null?'unknown':''}"><span class="primary-value">${remainingPct==null?'미확인':`${Math.round(remainingPct)}<small>%</small>`}</span>${mobileSecondary}</span><span class="account-info">${meter(w?.pct)}<span class="account-status ${a.active?'':'standby'}">${a.active?'사용 중':'대기'}</span><time class="reset-date" ${w?.resetsAt?`datetime="${esc(w.resetsAt)}"`:''}>${esc(shortReset(w?.resetsAt))}</time></span>${warning?`<span class="account-alert">${esc(warning)}</span>`:''}</button>`;
 }).join('');
 return `<section class="engine" data-prov="${provider}" aria-labelledby="heading-${provider}"><div class="engine-head"><div class="engine-title"><h2 id="heading-${provider}" title="${name}">${ENGINE_ROBOTS[provider]}<span class="sr-only">${name}</span></h2><span class="quota-label">${label}<span class="mobile-column-hint">계정 · 리셋 / 남은 %</span></span></div><span class="count">${accts.length}계정</span></div><div class="selected-account ${active?'is-active':'no-active'}">${headline}</div>${data.error?`<p class="engine-warning">조회 상태 확인 필요 · 설정에서 상세 보기</p>`:''}<div class="columns"><span>계정 · 리셋 시각</span><span>남은 한도</span></div><div class="accounts">${accounts||'<p class="empty">등록된 계정이 없습니다. 설정에서 계정을 추가해 주세요.</p>'}</div></section>`;
}
document.getElementById('units').innerHTML=unit('codex','Codex','계정 주간')+unit('claude','Claude','페이블 주간');
document.getElementById('reading-guide').textContent='숫자와 막대는 남은 양입니다. Codex는 계정 주간, Claude는 페이블 주간 한도를 표시합니다. 색이 있는 계정은 현재 기기의 사용 중 계정입니다. 각 계정을 누르면 전체 한도·리셋 시각·조회 상태를 볼 수 있습니다. 계정을 자동으로 전환하지 않습니다. 창을 열거나 새로 조회(⌘R·버튼)할 때 최신 사용량을 조회합니다.';
if(!LOCAL)document.getElementById('account-settings').hidden=true;
const accountDialog=document.getElementById('account-dialog'),settingsDialog=document.getElementById('settings-dialog');
document.querySelectorAll('.sheet').forEach(dialog=>{
 dialog.querySelector('[data-close]').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',e=>{if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
});
document.getElementById('settings-button').addEventListener('click',()=>settingsDialog.showModal());
function openAccount(provider,index){
 const a=D[provider].accounts[index],windows=a.windows||[];
 const needsLogin=(!windows.length&&!!a.error)||!!a.needsLogin;
 document.getElementById('account-title').textContent=a.email||'이메일 미확인';
 document.getElementById('account-provider').textContent=(provider==='codex'?'Codex':'Claude')+' · '+(a.plan?String(a.plan).toUpperCase():'계정');
 const body=document.getElementById('account-body');body.className='sheet-body dialog-account '+(a.active?'is-active':'is-standby');body.dataset.prov=provider;
 body.innerHTML=`<div class="account-status">${a.active?'● 사용 중':'대기'} · ${esc(ago(a.fetchedAt))}</div>${a.tier?`<p class="note">${esc(a.tier)}</p>`:''}${accountWarning(a)?`<p class="account-alert">${esc(accountWarning(a))}</p>`:''}${a.error?`<p class="note">${esc(a.error)}</p>`:''}${a.note?`<p class="note">${esc(a.note)}</p>`:''}<div class="detail-quotas">${windows.map(w=>`<div class="quota-row"><span>${esc(w.label)}</span><span class="quota-value">${pctText(remaining(w.pct))}</span>${meter(w.pct)}${resetMarkup(w.resetsAt)}</div>`).join('')||'<p class="note">조회된 한도가 없습니다.</p>'}</div>${provider==='codex'?`<h3>리셋 사용권</h3>${resetTapes(a.resetCredits,a.resetCreditDetails,a.fetchedAt)}`:''}<div class="detail-tools">${needsLogin&&LOCAL?`<div><button type="button" class="lbl box-ghost act-login" data-prov="${provider}" data-email="${esc(a.email)}">다시 로그인해서 조회</button><span class="account-op-status" role="status"></span></div>`:''}${LOCAL?`<button type="button" class="lbl danger" data-act="account-remove" data-prov="${provider}" data-email="${esc(a.email)}">계정 빼기</button>`:''}</div>`;
 accountDialog.showModal();
}
document.querySelectorAll('[data-account]').forEach(button=>button.addEventListener('click',()=>openAccount(button.dataset.prov,Number(button.dataset.account))));

const meta=document.getElementById("meta");meta.setAttribute("aria-live","polite");
meta.textContent=(D.generatedAt?(D.generatedAt||"").slice(5,16).replace("T"," ")+" 조회":"아직 조회하지 않음")+" · "+(LOCAL?"60초마다 갱신":"저장된 화면");
let refreshing=false;
const apiPath=path=>(location.pathname.match(/^\/device\/(?:home|office)\//)?.[0].slice(0,-1)||"")+path;
const STALE_MS=20*1000, AUTO_GUARD_KEY="limit-board-auto-refresh:"+(DEVICES.find(d=>d.current)?.path||"local");
const dataAge=()=>{const ts=D.generatedAt?new Date(D.generatedAt).getTime():NaN;return Number.isFinite(ts)?Date.now()-ts:Infinity};
async function refresh(auto){
 if(refreshing)return;
 if(!LOCAL||!/^https?:$/.test(location.protocol)){if(!auto)location.href="http://127.0.0.1:4790/";return;}
 refreshing=true;const button=document.getElementById("refresh-button"),label=button.querySelector(".refresh-label");
 button.style.minWidth=Math.ceil(button.getBoundingClientRect().width)+"px";button.disabled=true;button.classList.add("busy");label.textContent="조회 중…";
 meta.dataset.error="false";meta.textContent="최신 사용량을 조회하고 있습니다…";
 try{const response=await fetch(apiPath("/api/refresh"),{method:"POST",headers:{"X-Limit-Board":"refresh"}});const result=await response.json();if(!response.ok)throw new Error(result.error||"조회하지 못했습니다.");location.reload();}
 catch(error){meta.dataset.error="true";meta.textContent=(auto?"자동 조회 실패 · ":"")+error.message;button.disabled=false;button.classList.remove("busy");label.textContent="새로 조회";refreshing=false;}
}
document.querySelectorAll('[data-act="refresh"]').forEach(el=>{el.style.cursor="pointer";el.addEventListener("click",()=>refresh(false));});
// ⌘R / Ctrl+R (2026-09-12 user request): same as the button — always fetch, instead of a plain reload that the stale/60s guard may skip.
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&!e.altKey&&!e.shiftKey&&(e.key==="r"||e.key==="R")){e.preventDefault();refresh(false);}});
// 화면에서 계정 로그인·추가·빼기 (2026-09-11). 이 앱의 조회용 자격만 바꾸고 터미널·앱 로그인은 바꾸지 않는다.
if(LOCAL){
(()=>{
 const accountApi=(path,body)=>fetch(apiPath(path),{method:"POST",headers:{"X-Limit-Board":"account","Content-Type":"application/json"},body:JSON.stringify(body||{})})
  .then(r=>r.json().then(j=>({ok:r.ok,status:r.status,j})).catch(()=>({ok:r.ok,status:r.status,j:{}})));
 function pollCodexLogin(id,onDone){
  const timer=setInterval(()=>{
   fetch(apiPath("/api/login-status?id="+encodeURIComponent(id))).then(r=>r.json()).then(job=>{
    if(job.status==="done"){clearInterval(timer);onDone(null,job)}
    else if(job.status==="failed"){clearInterval(timer);onDone(job.message||"로그인에 실패했습니다.",job)}
   }).catch(()=>{});
  },2000);
 }
 function startCodexLogin(statusEl,button){
  button.disabled=true;
  statusEl.textContent="브라우저에서 OpenAI 로그인을 마치면 자동으로 표시됩니다 (최대 5분)";
  accountApi("/api/login",{provider:"codex"}).then(({ok,status,j})=>{
   if(!ok){statusEl.textContent=status===409?"이미 로그인이 진행 중입니다.":(j.error||"로그인을 시작하지 못했습니다.");button.disabled=false;return}
   pollCodexLogin(j.id,(err)=>{ if(err){statusEl.textContent=err;button.disabled=false} else location.reload() });
  }).catch(()=>{statusEl.textContent="로그인을 시작하지 못했습니다.";button.disabled=false});
 }
 function startClaudeLogin(statusEl,button){
  button.disabled=true;
  accountApi("/api/login",{provider:"claude"}).then(({ok,j})=>{
   if(!ok){statusEl.textContent=j.error||"로그인 주소를 만들지 못했습니다.";button.disabled=false;return}
   const win=window.open(j.url,"_blank");
   statusEl.innerHTML="";
   const info=document.createElement("div");
   info.textContent=win?"로그인 창을 열었습니다. 로그인 후 code#state를 붙여넣으세요.":"팝업이 막혔습니다. 아래 링크로 로그인 후 code#state를 붙여넣으세요.";
   statusEl.appendChild(info);
   if(!win){const a=document.createElement("a");a.href=j.url;a.target="_blank";a.rel="noopener";a.textContent="Claude 로그인 페이지 열기";statusEl.appendChild(a)}
   const row=document.createElement("div");row.className="op-row";
   const input=document.createElement("input");input.placeholder="로그인 후 화면의 코드(code#state) 붙여넣기";
   const ok_btn=document.createElement("button");ok_btn.type="button";ok_btn.className="lbl box-ghost";ok_btn.textContent="확인";
   row.appendChild(input);row.appendChild(ok_btn);statusEl.appendChild(row);
   ok_btn.addEventListener("click",()=>{
    const code=input.value.trim();
    if(!code){input.focus();return}
    ok_btn.disabled=true;input.disabled=true;
    accountApi("/api/login-exchange",{provider:"claude",code}).then(({ok,j})=>{
     if(ok)location.reload();
     else{info.textContent=j.error||"교환에 실패했습니다.";ok_btn.disabled=false;input.disabled=false}
    }).catch(()=>{info.textContent="교환하지 못했습니다.";ok_btn.disabled=false;input.disabled=false});
   });
  }).catch(()=>{statusEl.textContent="로그인 주소를 만들지 못했습니다.";button.disabled=false});
 }
 document.addEventListener("click",e=>{
  const loginBtn=e.target.closest(".act-login");
  if(loginBtn){
   const statusEl=loginBtn.nextElementSibling;
   if(loginBtn.dataset.prov==="codex")startCodexLogin(statusEl,loginBtn);else startClaudeLogin(statusEl,loginBtn);
   return;
  }
  const addBtn=e.target.closest('[data-act="account-add"]');
  if(addBtn){
   const statusEl=addBtn.nextElementSibling;
   if(addBtn.dataset.prov==="codex")startCodexLogin(statusEl,addBtn);else startClaudeLogin(statusEl,addBtn);
   return;
  }
  const rmBtn=e.target.closest('[data-act="account-remove"]');
  if(rmBtn){
   const prov=rmBtn.dataset.prov,email=rmBtn.dataset.email;
   if(!confirm(email+" 계정을 목록과 조회용 자격에서 뺄까요? 터미널·앱의 실제 로그인은 바뀌지 않습니다."))return;
   rmBtn.disabled=true;
   accountApi("/api/account-remove",{provider:prov,email}).then(({ok,j})=>{
    if(ok){try{sessionStorage.setItem("limit-board-account-msg",j.stillVisible?(j.message||""):"")}catch(err){}location.reload()}
    else{alert(j.error||"계정을 빼지 못했습니다.");rmBtn.disabled=false}
   }).catch(()=>{alert("계정을 빼지 못했습니다.");rmBtn.disabled=false});
  }
 });
 try{
  const msg=sessionStorage.getItem("limit-board-account-msg");
  if(msg){sessionStorage.removeItem("limit-board-account-msg");meta.textContent=msg}
 }catch(e){}
})();
}
// Opening the window or bringing a hidden window back fetches fresh usage when the shown data is older than STALE_MS (⌘R is handled above and always fetches).
function autoRefresh(){
 if(!LOCAL||!/^https?:$/.test(location.protocol)||dataAge()<=STALE_MS)return;
 let last=0;try{last=Number(sessionStorage.getItem(AUTO_GUARD_KEY))||0}catch(e){}
 if(Date.now()-last<60*1000)return; // a refresh that still left stale data must not loop
 try{sessionStorage.setItem(AUTO_GUARD_KEY,String(Date.now()))}catch(e){}
 refresh(true);
}
autoRefresh();
window.addEventListener("pageshow",e=>{if(e.persisted)autoRefresh()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")autoRefresh()});
setInterval(()=>{document.querySelectorAll(".reset-clock").forEach(el=>{const r=resetText(el.dataset.reset);el.firstElementChild.textContent=r.relative;el.lastElementChild.textContent=r.date})},30000);
const st=[];const okb=(ok,t)=>`<b class="${ok?"":"off"}">${t}</b>`;
const shortErr=e=>e?esc(String(e).split(";")[0].slice(0,60)):"";
st.push(`codex ${okb(!D.codex.error,D.codex.error?"오류":"정상")} · ${D.codex.accounts.length}계정 · 터미널 ${esc((D.codex.inUse||{}).home||"미확인")}${D.codex.error?" · "+shortErr(D.codex.error):""}`);
st.push(`claude ${okb(!D.claude.error,D.claude.error?"일부 오류":"정상")} · ${D.claude.accounts.length}계정 · cmux·터미널 ~/.claude${D.claude.error?" · "+shortErr(D.claude.error):""}`);
st.push(`조회 ${okb(true,"수동")} · ${esc((D.generatedAt||"").slice(5,16).replace("T"," "))} · 자동 웹 배포 ${okb(true,"꺼짐")}`);
document.getElementById("agents").innerHTML=st.map(s=>`<div>${s}</div>`).join("");
(()=>{const d=document.getElementById("footer-details"),k="limit-board-footer-open";try{d.open=localStorage.getItem(k)==="1"}catch(e){}d.addEventListener("toggle",()=>{try{localStorage.setItem(k,d.open?"1":"0")}catch(e){}})})();
document.getElementById("events").innerHTML=((D.events||[]).length?D.events.map(e=>`<div>${esc(e)}</div>`).join(""):`<div>계정·조회 상태 변화 없음</div>`);
</script>
</body></html>
